name: Verify PropLedger build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python archive script
        run: python -m py_compile scripts/update_nba_results.py scripts/build_insights.py scripts/backfill_h2h.py
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build frontend
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
