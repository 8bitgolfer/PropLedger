name: Refresh NBA scores and schedule
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_nba_results.py'
      - 'scripts/build_insights.py'
      - 'scripts/backfill_h2h.py'
      - '.github/workflows/nba-results.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Optional historical backfill start YYYY-MM-DD'
        required: false
        type: string
      end_date:
        description: 'Optional historical backfill end YYYY-MM-DD (max 90 days)'
        required: false
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nba-results-archive
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch NBA schedules and final player statistics
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -n "$START_DATE" ]; then
            python scripts/update_nba_results.py --start "$START_DATE" --end "${END_DATE:-$START_DATE}"
          else
            python scripts/update_nba_results.py
          fi
      - name: Expand prior-season H2H history (bounded batch)
        run: python scripts/backfill_h2h.py
      - name: Build historical chart index
        run: python scripts/build_insights.py
      - name: Publish historical archive without rebase conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve this run's results outside the checkout. The remote may
          # have advanced during the long historical backfill.
          mkdir -p /tmp/propledger-archive-snapshot
          cp -a public/. /tmp/propledger-archive-snapshot/

          # Reconstruct from the newest main and merge game IDs instead of
          # rebasing two generated JSON versions against each other.
          for attempt in 1 2 3 4; do
            echo "Publishing archive attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_generated_archive.py --source /tmp/propledger-archive-snapshot
            python scripts/build_insights.py
            git add -A public/

            if git diff --cached --quiet; then
              echo "NBA archive is already up to date."
              exit 0
            fi
            git commit -m "Archive NBA schedules and final box scores"
            if git push origin HEAD:main; then
              echo "Archived player results and H2H history published."
              exit 0
            fi
            echo "main advanced during publish. Re-merging against newest commit."
            sleep 3
          done
          echo "Failed to publish after four retries." >&2
          exit 1

  publish-pages:
    needs: refresh
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out latest updated main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build website with latest NBA results
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload website build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: publish-pages
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed NBA website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
