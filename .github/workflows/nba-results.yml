name: Refresh NBA box scores
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch final NBA box scores
        run: python scripts/update_nba_results.py
      - name: Commit changed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nba-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA final box scores"
            git push
          fi
